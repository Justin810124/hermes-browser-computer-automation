<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Browser Computer Automation demo</title>
  <desc id="desc">Animated overview showing Hermes choosing browser tools, real Chrome, native upload control, and stopping at human verification gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 36px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #d1fae5; }
      .terminal { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #e5e7eb; }
      .muted { fill: #94a3b8; }
      .green { fill: #10b981; }
      .blue { fill: #3b82f6; }
      .amber { fill: #f59e0b; }
      .red { fill: #ef4444; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .dark-card { fill: #111827; stroke: #334155; stroke-width: 2; }
      .panel-title { font: 800 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .fade1 { animation: fade1 16s infinite; }
      .fade2 { animation: fade2 16s infinite; opacity: 0; }
      .fade3 { animation: fade3 16s infinite; opacity: 0; }
      .fade4 { animation: fade4 16s infinite; opacity: 0; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }
      .cursor { animation: cursor 1.2s ease-in-out infinite; }
      @keyframes fade1 { 0%,22%{opacity:1} 27%,100%{opacity:0} }
      @keyframes fade2 { 0%,24%{opacity:0} 29%,47%{opacity:1} 52%,100%{opacity:0} }
      @keyframes fade3 { 0%,49%{opacity:0} 54%,72%{opacity:1} 77%,100%{opacity:0} }
      @keyframes fade4 { 0%,74%{opacity:0} 79%,97%{opacity:1} 100%{opacity:0} }
      @keyframes pulse { 0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.08); opacity:.78} }
      @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:.25} }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="140" r="180" fill="#2563eb" opacity="0.08"/>
  <circle cx="150" cy="620" r="220" fill="#10b981" opacity="0.07"/>

  <text x="64" y="72" class="title">Hermes Browser Computer Automation</text>
  <text x="66" y="108" class="subtitle">Real Chrome workflows, native uploads, and human verification boundaries.</text>

  <g transform="translate(64,155)" filter="url(#shadow)">
    <rect width="1152" height="500" rx="22" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <rect x="24" y="24" width="1104" height="452" rx="18" fill="#0f172a"/>
  </g>

  <g class="fade1">
    <text x="110" y="230" class="panel-title">1. Choose the right control surface</text>
    <g transform="translate(110,270)">
      <rect width="320" height="220" rx="18" class="dark-card"/>
      <text x="28" y="48" class="panel-title">Browser tools</text>
      <text x="28" y="88" class="subtitle">Ordinary pages</text>
      <text x="28" y="126" class="mono">browser_snapshot()</text>
      <text x="28" y="160" class="mono">browser_click()</text>
      <circle cx="280" cy="178" r="18" class="blue pulse"/>
    </g>
    <g transform="translate(480,270)">
      <rect width="320" height="220" rx="18" class="dark-card"/>
      <text x="28" y="48" class="panel-title">Real Chrome</text>
      <text x="28" y="88" class="subtitle">Logged-in workflows</text>
      <text x="28" y="126" class="mono">computer_use()</text>
      <text x="28" y="160" class="mono">app="Google Chrome"</text>
      <circle cx="280" cy="178" r="18" class="green pulse"/>
    </g>
    <g transform="translate(850,270)">
      <rect width="320" height="220" rx="18" class="dark-card"/>
      <text x="28" y="48" class="panel-title">Native UI</text>
      <text x="28" y="88" class="subtitle">File pickers</text>
      <text x="28" y="126" class="mono">CuaDriver</text>
      <text x="28" y="160" class="mono">macOS control</text>
      <circle cx="280" cy="178" r="18" class="amber pulse"/>
    </g>
  </g>

  <g class="fade2">
    <text x="110" y="230" class="panel-title">2. Work inside the user's real Chrome session</text>
    <g transform="translate(130,260)" filter="url(#shadow)">
      <rect width="700" height="330" rx="18" fill="url(#chrome)"/>
      <rect x="0" y="0" width="700" height="54" rx="18" fill="#e2e8f0"/>
      <circle cx="28" cy="27" r="8" fill="#ef4444"/>
      <circle cx="54" cy="27" r="8" fill="#f59e0b"/>
      <circle cx="80" cy="27" r="8" fill="#10b981"/>
      <rect x="120" y="15" width="520" height="24" rx="12" fill="#f8fafc"/>
      <text x="142" y="33" class="small">https://example.com/seller/profile/edit</text>
      <text x="34" y="94" class="label">Seller profile draft</text>
      <rect x="34" y="122" width="290" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="52" y="150" class="small">Professional AI Art Generator</text>
      <rect x="34" y="184" width="610" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="52" y="216" class="small">Hi! I create high-quality digital artwork...</text>
      <text x="52" y="246" class="small">Character art, product visuals, portraits...</text>
      <rect x="512" y="292" width="132" height="38" rx="12" fill="#2563eb"/>
      <text x="548" y="318" style="font:700 16px ui-sans-serif; fill:#fff">Save draft</text>
      <path d="M 416 302 L 442 332 L 454 314 L 492 360" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(880,300)">
      <rect width="260" height="220" rx="18" class="dark-card"/>
      <text x="28" y="48" class="panel-title">Hermes sees:</text>
      <text x="28" y="92" class="terminal">✓ logged-in Chrome</text>
      <text x="28" y="128" class="terminal">✓ required fields</text>
      <text x="28" y="164" class="terminal">✓ save button</text>
      <text x="28" y="200" class="terminal">✓ no publish yet</text>
    </g>
  </g>

  <g class="fade3">
    <text x="110" y="230" class="panel-title">3. Prepare and upload local files safely</text>
    <g transform="translate(125,275)">
      <rect width="410" height="250" rx="18" class="dark-card"/>
      <text x="28" y="52" class="panel-title">Local file selection</text>
      <text x="28" y="94" class="terminal">$ find ~/Downloads -iname '*.png'</text>
      <text x="28" y="130" class="terminal">✓ upload-01-hero.png</text>
      <text x="28" y="166" class="terminal">✓ upload-02-portrait.png</text>
      <text x="28" y="202" class="terminal">✓ upload-03-scene.png</text>
    </g>
    <g transform="translate(585,275)">
      <rect width="560" height="250" rx="18" fill="#f8fafc"/>
      <text x="28" y="50" class="label">Native upload dialog</text>
      <rect x="28" y="78" width="150" height="120" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
      <rect x="204" y="78" width="150" height="120" rx="12" fill="#dcfce7" stroke="#86efac"/>
      <rect x="380" y="78" width="150" height="120" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="53" y="222" class="small">hero.png</text>
      <text x="222" y="222" class="small">portrait.png</text>
      <text x="410" y="222" class="small">scene.png</text>
      <circle cx="505" cy="45" r="17" class="green pulse"/>
    </g>
  </g>

  <g class="fade4">
    <text x="110" y="230" class="panel-title">4. Stop at human verification gates</text>
    <g transform="translate(160,275)" filter="url(#shadow)">
      <rect width="460" height="250" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
      <circle cx="62" cy="68" r="28" fill="#f59e0b"/>
      <text x="54" y="78" style="font:800 34px ui-sans-serif; fill:#fff">!</text>
      <text x="110" y="66" class="label">Human verification</text>
      <text x="110" y="104" class="small">CAPTCHA / PerimeterX / 2FA</text>
      <text x="110" y="142" class="small">Identity / tax / payment / publish</text>
      <rect x="110" y="178" width="260" height="42" rx="12" fill="#f59e0b"/>
      <text x="142" y="205" style="font:800 16px ui-sans-serif; fill:#fff">Stop and ask the user</text>
    </g>
    <g transform="translate(685,292)">
      <rect width="390" height="210" rx="18" class="dark-card"/>
      <text x="28" y="52" class="panel-title">Correct behavior</text>
      <text x="28" y="94" class="terminal">1. Pause automation</text>
      <text x="28" y="130" class="terminal">2. User completes gate</text>
      <text x="28" y="166" class="terminal">3. Re-capture page</text>
      <text x="28" y="202" class="terminal">4. Continue ordinary UI work</text>
    </g>
  </g>

  <text x="64" y="690" style="font:600 16px ui-sans-serif; fill:#94a3b8">Open source: github.com/Justin810124/hermes-browser-computer-automation</text>
</svg>
